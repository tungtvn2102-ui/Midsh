<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PvE 3D World</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0e0f12; color: #e6e6e6; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial; overflow: hidden; }
    #hud { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; user-select: none; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
    .bar { width: 260px; height: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; }
    .bar > .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #16a34a, #22c55e); transition: width 120ms linear; }
    #meta { font-size: 14px; opacity: 0.9; }
    #crosshair { position: fixed; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,0.9); }
    #crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
    #crosshair::after { top: 7px; left: 0; height: 2px; width: 16px; }
    #overlay { position: fixed; inset: 0; background: radial-gradient(1200px 800px at 50% 50%, rgba(24,24,27,0.85), rgba(9,9,11,0.98)); display: flex; align-items: center; justify-content: center; z-index: 20; }
    #overlay .panel { width: min(92vw, 640px); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.35); backdrop-filter: blur(6px); text-align: center; }
    .title { font-weight: 700; font-size: 22px; margin-bottom: 10px; }
    .subtitle { opacity: 0.9; margin-bottom: 16px; }
    .kbd { display: inline-block; padding: 2px 8px; border: 1px solid rgba(255,255,255,0.2); border-bottom-width: 2px; border-radius: 6px; margin: 0 4px; font-size: 13px; background: rgba(255,255,255,0.06); }
    .btn { display: inline-block; margin-top: 10px; padding: 10px 14px; background: #2563eb; border: none; color: white; border-radius: 8px; cursor: pointer; transition: transform 80ms ease, filter 80ms ease; }
    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: translateY(1px); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
  <link rel="icon" href="data:,">
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Simple controllable 3D PvE world using Three.js" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">
</head>
<body>
  <div id="hud">
    <div class="bar" title="Health"><div id="healthFill" class="fill" style="width: 100%"></div></div>
    <div id="meta">Health: <span id="healthText">100</span> | Score: <span id="scoreText">0</span> | Enemies: <span id="enemiesText">0</span></div>
    <div id="statusText" style="font-size: 14px; color: #fbbf24;"></div>
  </div>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="overlay">
    <div class="panel">
      <div class="title" style="font-size: 34px; letter-spacing: 0.5px;">Care Your Time</div>
      <div id="universe" style="position: relative; width: 100%; height: 320px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 14px; background: radial-gradient(800px 300px at 50% 110%, rgba(109,40,217,0.35), rgba(0,0,0,0) 60%), radial-gradient(400px 180px at 50% 100%, rgba(34,211,238,0.12), rgba(0,0,0,0) 60%);">
        <!-- Universe 3D canvas injected by main.js -->
      </div>
      <div class="subtitle" style="margin-top: 6px;">Rules</div>
      <ul style="text-align:left; margin: 0 auto 12px auto; padding-left: 18px; max-width: 620px; line-height: 1.6;">
        <li>W/A/S/D to move, mouse to look, Space to jump.</li>
        <li>Left Click shoots. Right Click charges a massive fireball.</li>
        <li>Giant enemies move faster and stun on hit; keep distance.</li>
        <li>Survive as long as possible to increase your score.</li>
      </ul>
      <button id="startBtn" class="btn">Start</button>
      <div id="overlayMessage" style="margin-top: 10px; opacity: 0.8;"></div>
    </div>
  </div>
</body>
</html>
